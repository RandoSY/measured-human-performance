; FFT+ Heart Rate Monitor Simulator R1.0
; BBC micro:bit V2.21 / nRF52833
;
; Build:
;   py -3.13 -m platformio run
;
; Upload through CMSIS-DAP/OpenOCD:
;   py -3.13 -m platformio run -t upload
;
; Reliable alternative: copy
;   .pio\build\fft_hrm_sim_microbit_v2\firmware.hex
; to the MICROBIT drive.

[platformio]
default_envs = fft_hrm_sim_microbit_v2

[env:fft_hrm_sim_microbit_v2]
platform = https://github.com/h2zero/platform-n-able.git#1.2.0
board = bbcmicrobitv2
framework = arduino
platform_packages =
    framework-n-able-arduino @ https://github.com/h2zero/n-able-Arduino.git#470a97a59831c8d2aa07a13cdf3a52d67ee21712

upload_protocol = cmsis-dap
monitor_speed = 115200
monitor_filters = time

lib_deps =
    h2zero/NimBLE-Arduino@2.5.0
    adafruit/Adafruit Microbit Library@1.3.4

build_flags =
    -D FFT_HRM_BUTTON_A_PIN=5
    -D FFT_HRM_BUTTON_B_PIN=11
    -D CONFIG_MAIN_TASK_STACK_SIZE=1024
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    -D CONFIG_BT_NIMBLE_MAX_CCCDS=8
