; Fair Fitness Tester FFT+ R2.0.2 — micro:bit V2.21 dual-role BLE
; Matrix-enabled build only
; Nordic nRF52833 + n-able + NimBLE-Arduino: NUS peripheral + HRS central
;
; Build:
;   py -3.13 -m platformio run
;
; Upload through the micro:bit DAPLink/CMSIS-DAP interface:
;   py -3.13 -m platformio run -t upload
;
; Serial monitor:
;   py -3.13 -m platformio device monitor -b 115200

[platformio]
default_envs = fairfit_microbit_v2

[env:fairfit_microbit_v2]
platform = https://github.com/h2zero/platform-n-able.git#1.2.0
board = bbcmicrobitv2
framework = arduino
platform_packages =
    framework-n-able-arduino @ https://github.com/h2zero/n-able-Arduino.git#470a97a59831c8d2aa07a13cdf3a52d67ee21712
upload_protocol = cmsis-dap
monitor_speed = 115200
monitor_filters = time
lib_deps =
    h2zero/NimBLE-Arduino@2.5.0
    adafruit/Adafruit Microbit Library@1.3.4
build_flags =
    -D FAIRFIT_MATRIX_ENABLED=1
    -D FAIRFIT_SPEAKER_PIN=27
    -D FAIRFIT_BUTTON_A_PIN=5
    -D FAIRFIT_BUTTON_B_PIN=11
    -D FAIRFIT_NUS_CHUNK_BYTES=18
    -D FAIRFIT_LOG_LEVEL=1
    -D CONFIG_MAIN_TASK_STACK_SIZE=1024
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
    -D CONFIG_BT_NIMBLE_MAX_CCCDS=12
